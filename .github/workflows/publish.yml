name: Build and Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      tag_latest:
        description: 'Update the latest (bundled browser) and remote image tags'
        required: false
        type: boolean
        default: true

env:
  IMAGE_NAME: ghcr.io/williamwu277/observer

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: local
            suffix: ''
            moving_tag: latest
          - target: remote
            suffix: '-remote'
            moving_tag: remote
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          cache-from: type=gha,scope=observer-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=observer-${{ matrix.target }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}${{ matrix.suffix }}
            ${{ inputs.tag_latest == true && format('{0}:{1}', env.IMAGE_NAME, matrix.moving_tag) || '' }}
