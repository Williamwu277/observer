name: Build and Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      tag_latest:
        description: 'Tag the image as latest'
        required: false
        type: boolean
        default: true

env:
  IMAGE_NAME: ghcr.io/williamwu277/observer

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ inputs.tag_latest == true && format('{0}:latest', env.IMAGE_NAME) || '' }}
